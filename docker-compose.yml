services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: local-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: localai
    volumes:
      - pgdata:/var/lib/postgresql

  chat-ui:
    build: .
    container_name: rag-chat-ui
    restart: unless-stopped
    ports:
      - "8088:88"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: localdev
      PGDATABASE: localai
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

volumes:
  pgdata:
